name: Golden stacks

on:
  push:
    branches: [main, dev, "release/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  golden:
    name: ${{ matrix.runner }} / ${{ matrix.architecture }} / Python ${{ matrix.python }} / ${{ matrix.package-manager }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.12", "3.13"]
        package-manager: [npm, pnpm]
        include:
          - runner: ubuntu-24.04
            architecture: x64
          - runner: macos-15
            architecture: arm64
          - runner: windows-2025
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:golden
        env:
          CI: true
          REPOSETUP_GOLDEN_PACKAGE_MANAGER: ${{ matrix.package-manager }}
      - name: Write golden qualification evidence
        run: >-
          node -e "require('node:fs').writeFileSync('golden-evidence.json',
          JSON.stringify({ platform: process.platform, architecture: process.arch,
          node: process.version, python: require('node:child_process').execFileSync('python',
          ['--version'], { encoding: 'utf8' }).trim(), uv: require('node:child_process').execFileSync('uv',
          ['--version'], { encoding: 'utf8' }).trim() }, null, 2) + '\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-evidence-${{ matrix.runner }}-python-${{ matrix.python }}-${{ matrix.package-manager }}
          path: golden-evidence.json
          if-no-files-found: error
