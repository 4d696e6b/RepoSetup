name: Golden stacks

on:
  push:
    branches: [main, dev, "release/**", codex/0.3.0-cli, codex/0.3.0-candidate-integration]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  golden:
    name: ${{ matrix.runner }} / ${{ matrix.architecture }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            python: "3.12"
          - runner: ubuntu-24.04
            architecture: x64
            python: "3.13"
          - runner: macos-15
            architecture: arm64
            python: "3.12"
          - runner: macos-15
            architecture: arm64
            python: "3.13"
          - runner: windows-2025
            architecture: x64
            python: "3.12"
          - runner: windows-2025
            architecture: x64
            python: "3.13"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      UV_PYTHON: python
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:golden
        env:
          CI: true
      - name: Write golden qualification evidence
        run: >-
          node -e "require('node:fs').writeFileSync('golden-evidence.json',
          JSON.stringify({ platform: process.platform, architecture: process.arch,
          node: process.version, python: require('node:child_process').execFileSync('python',
          ['--version'], { encoding: 'utf8' }).trim(), uv: require('node:child_process').execFileSync('uv',
          ['--version'], { encoding: 'utf8' }).trim() }, null, 2) + '\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: golden-evidence-${{ matrix.runner }}-python-${{ matrix.python }}
          path: golden-evidence.json
          if-no-files-found: error
