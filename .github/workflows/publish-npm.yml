name: Publish npm

on:
  workflow_dispatch:
    inputs:
      qualification_run_ids:
        description: Three passing release.yml run IDs from the exact stable SHA, oldest first
        required: true
        type: string
      publish:
        description: Owner authorization to publish the qualified artifact (false performs a dry-run)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-rsetup
  cancel-in-progress: false

jobs:
  publish:
    outputs:
      artifact_id: ${{ steps.qualification.outputs.artifact_id }}
      run_id: ${{ steps.qualification.outputs.run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact-source qualification
        id: qualification
        run: node scripts/check-release-qualification.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_IDS: ${{ inputs.qualification_run_ids }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.qualification.outputs.artifact_id }}
          run-id: ${{ steps.qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - name: Verify qualified tarball and actual launchers without rebuilding
        run: node scripts/verify-packed-artifact.mjs --directory candidate
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.qualification.outputs.package_version }}
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish or dry-run the previously qualified artifact
        run: node scripts/publish-qualified-artifact.mjs
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          NPM_CONFIG_PROVENANCE: "true"

  registry-acceptance:
    if: inputs.publish
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish.outputs.artifact_id }}
          run-id: ${{ needs.publish.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - name: Verify exact published version outside the monorepo
        run: node scripts/verify-registry-release.mjs
