name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  fast:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Typecheck offline task qualification infrastructure
        run: pnpm typecheck:task-tests
      - name: Check frozen task fixtures and extracted packed contracts without AI credentials
        run: pnpm exec vitest run --config tests/e2e/vitest.tasks.config.ts
      - run: pnpm registry:validate
