name: Platform

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  platform:
    name: ${{ matrix.runner }} / ${{ matrix.architecture }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            node: 20
          - runner: ubuntu-24.04
            architecture: x64
            node: 22
          - runner: ubuntu-24.04
            architecture: x64
            node: 24
          - runner: macos-15
            architecture: arm64
            node: 22
          - runner: macos-15
            architecture: arm64
            node: 24
          - runner: windows-2025
            architecture: x64
            node: 22
          - runner: windows-2025
            architecture: x64
            node: 24
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e
      - name: Measure planner benchmark
        if: matrix.node == 24
        run: pnpm benchmark:plans
        env:
          REPOSETUP_BENCHMARK_TRIALS: "5"
          REPOSETUP_BENCHMARK_OUTPUT: planner-benchmark.json
      - name: Write platform evidence
        run: >-
          node -e "require('node:fs').writeFileSync('platform-evidence.json',
          JSON.stringify({ platform: process.platform, architecture: process.arch,
          node: process.version }, null, 2) + '\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-evidence-${{ matrix.runner }}-node-${{ matrix.node }}
          path: |
            platform-evidence.json
            planner-benchmark.json
          if-no-files-found: error
