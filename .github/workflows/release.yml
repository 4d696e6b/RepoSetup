name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm registry:validate
      - run: pnpm test:e2e
      - run: pnpm pack:packages
      - uses: actions/upload-artifact@v4
        with:
          name: reposetup-packs
          path: packages/cli/*.tgz
