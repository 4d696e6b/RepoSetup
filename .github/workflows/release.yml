name: Release candidate qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Platform qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm registry:validate
      - run: pnpm test:e2e

  golden:
    name: Recipe qualification (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.17"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:golden

  faults:
    name: Failure-path qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Exercise timeout, interruption, permission, and user-file safeguards
        run: pnpm test
      - name: Exercise invalid input and mutation failure paths
        run: pnpm test:e2e
      - name: Exercise a generated development server with its default port occupied
        run: pnpm test:usability
        env:
          CI: true
          REPOSETUP_USABILITY: "1"
          REPOSETUP_USABILITY_PRESET: react-vite
          REPOSETUP_USABILITY_ADD: zod
          REPOSETUP_USABILITY_OCCUPY_DEV_PORT: "1"
          REPOSETUP_USABILITY_EVIDENCE: usability-fault-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: usability-fault-${{ matrix.os }}
          path: usability-fault-evidence.json
          if-no-files-found: error

  offline-tasks:
    name: Offline task qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      # All task qualification uses fake transport; never inherit live credentials.
      OPENAI_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:task-tests
      - run: pnpm lint
      - name: Record exact task source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p task-qualification-evidence
          node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); fs.writeFileSync("task-qualification-evidence/identity.json", JSON.stringify({schemaVersion: 1, sourceSha: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID, workflowAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), platform: process.platform, architecture: process.arch, node: process.version, lockfileHash: crypto.createHash("sha256").update(fs.readFileSync("pnpm-lock.yaml")).digest("hex"), providerMode: "simulated", liveQualification: false}, null, 2) + "\n")'
      - name: Review dependency licenses and advisories without fixes
        shell: bash
        run: |
          set -euo pipefail
          pnpm review:licenses 2>&1 | tee task-qualification-evidence/licenses.log
          pnpm audit --prod --json 2>&1 | tee task-qualification-evidence/production-audit.json
          pnpm audit --json 2>&1 | tee task-qualification-evidence/workspace-audit.json
      - name: Frozen task and packed compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config tests/e2e/vitest.tasks.config.ts 2>&1 | tee task-qualification-evidence/check-1.log
      - name: Concrete CLI verification and routed repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter rsetup exec vitest run --config vitest.verification.config.ts 2>&1 | tee task-qualification-evidence/check-2.log
      - name: Require unchanged source after qualification
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Retain task evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-offline-tasks-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: task-qualification-evidence/
          if-no-files-found: error
          retention-days: 14

  full-task-verifier:
    name: Full task verifier qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      # All task qualification uses fake transport; never inherit live credentials.
      OPENAI_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:task-tests
      - run: pnpm lint
      - name: Record exact task source and runtime
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p task-qualification-evidence
          node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); fs.writeFileSync("task-qualification-evidence/identity.json", JSON.stringify({schemaVersion: 1, sourceSha: process.env.GITHUB_SHA, workflowRunId: process.env.GITHUB_RUN_ID, workflowAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), platform: process.platform, architecture: process.arch, node: process.version, lockfileHash: crypto.createHash("sha256").update(fs.readFileSync("pnpm-lock.yaml")).digest("hex"), providerMode: "simulated", liveQualification: false}, null, 2) + "\n")'
      - name: Review dependency licenses and advisories without fixes
        shell: bash
        run: |
          set -euo pipefail
          pnpm review:licenses 2>&1 | tee task-qualification-evidence/licenses.log
          pnpm audit --prod --json 2>&1 | tee task-qualification-evidence/production-audit.json
          pnpm audit --json 2>&1 | tee task-qualification-evidence/workspace-audit.json
      - name: Real tools, scoped effects, acceptance and retained failure accounting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config tests/e2e/vitest.task-verifier.config.ts 2>&1 | tee task-qualification-evidence/check-1.log
      - name: Require unchanged source after qualification
        run: git diff --exit-code && git diff --cached --exit-code
      - name: Retain task evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-full-task-verifier-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: task-qualification-evidence/
          if-no-files-found: error
          retention-days: 14

  pack-candidate:
    name: Pack identified candidate
    needs: [platform, golden, faults, offline-tasks, full-task-verifier]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm review:licenses --output candidate/dependency-licenses.json
      - run: pnpm --filter rsetup pack --pack-destination candidate
      - name: Record artifact identity
        run: node scripts/write-artifact-evidence.mjs --tarball candidate/rsetup-*.tgz --source-sha "$GITHUB_SHA" --output candidate/candidate-artifact.json
      - name: Match the website's pinned CLI artifact
        run: node scripts/check-candidate-artifact.mjs candidate/candidate-artifact.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-artifact
          path: candidate/
          if-no-files-found: error

  artifact-acceptance:
    name: Packed artifact acceptance (${{ matrix.os }})
    needs: pack-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: candidate-artifact
          path: candidate
      - run: node scripts/verify-packed-artifact.mjs --directory candidate
