name: Usability sessions

on:
  push:
    branches: [main, dev, "release/**"]
  workflow_dispatch:

jobs:
  session:
    name: ${{ matrix.runner }} / ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
        preset: [react-vite, next-sqlite, express-postgres, fastapi, flask]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:usability
        env:
          CI: true
          REPOSETUP_USABILITY: "1"
          REPOSETUP_USABILITY_PRESET: ${{ matrix.preset }}
          REPOSETUP_USABILITY_ADD: ${{ (matrix.preset == 'fastapi' || matrix.preset == 'flask') && 'pydantic' || 'zod' }}
          REPOSETUP_USABILITY_EVIDENCE: usability-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: usability-${{ matrix.runner }}-${{ matrix.preset }}
          path: usability-evidence.json
          if-no-files-found: error
