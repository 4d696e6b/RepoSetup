name: Selection packed contract (0.3.0)

on:
  push:
    branches: [codex/0.3.0-cli, codex/0.3.0-candidate-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: matrix
        name: Read frozen runner matrix
        run: >-
          node -e "const fs = require('node:fs');
          const matrix = JSON.parse(fs.readFileSync('tests/e2e/fixtures/selection-v1.matrix.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'platforms=' + JSON.stringify(matrix.platforms) + '\n');"
      - name: Pack one artifact and record source/hash
        run: |
          mkdir "$RUNNER_TEMP/selection-candidate"
          pnpm --filter rsetup pack --pack-destination "$RUNNER_TEMP/selection-candidate"
          node scripts/write-artifact-evidence.mjs --tarball "$RUNNER_TEMP"/selection-candidate/rsetup-*.tgz --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/selection-candidate/candidate-artifact.json"
      - name: Verify candidate matches the website's pinned artifact
        if: github.ref_name == 'codex/0.3.0-candidate-integration'
        run: node scripts/check-candidate-artifact.mjs "$RUNNER_TEMP/selection-candidate/candidate-artifact.json"
      - uses: actions/upload-artifact@v4
        with:
          name: selection-contract-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/selection-candidate
          if-no-files-found: error

  contract:
    needs: pack
    name: ${{ matrix.runner }} / packed selection contract
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:selection-tests
      - uses: actions/download-artifact@v4
        with:
          name: selection-contract-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/selection-candidate
      - name: Accept the same identified artifact on each runner
        run: pnpm exec vitest run --config tests/e2e/vitest.selection.config.ts
        env:
          REPOSETUP_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/selection-candidate
          REPOSETUP_SELECTION_REPORT: ${{ runner.temp }}/selection-contract-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-contract-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/selection-contract-report.json
          if-no-files-found: error

  transport:
    needs: pack
    name: ${{ matrix.runner }} / native selection transport
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
      - name: Install Windows pseudo-terminal test driver
        if: runner.os == 'Windows'
        run: "python -m pip install --only-binary=:all: pywinpty==3.0.5"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck:selection-tests
      - uses: actions/download-artifact@v4
        with:
          name: selection-contract-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/selection-candidate
      - name: Check native aliases, shell bounds and terminal confirmation
        run: pnpm exec vitest run --config tests/e2e/vitest.selection-transport.config.ts
        env:
          REPOSETUP_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/selection-candidate
          REPOSETUP_SELECTION_TRANSPORT_EVIDENCE_DIR: ${{ runner.temp }}/selection-transport-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-transport-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/selection-transport-evidence
          if-no-files-found: error

  maintenance:
    needs: pack
    name: ${{ matrix.runner }} / packed maintenance safety
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pack.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.architecture }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run core and CLI safety regressions on this platform
        run: pnpm test
      - run: pnpm typecheck:selection-tests
      - uses: actions/download-artifact@v4
        with:
          name: selection-contract-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/selection-candidate
      - name: Check repair, refusal and preservation with the same packed artifact
        run: pnpm exec vitest run --config tests/e2e/vitest.maintenance.config.ts
        env:
          REPOSETUP_SELECTION_ARTIFACT_DIR: ${{ runner.temp }}/selection-candidate
          REPOSETUP_MAINTENANCE_REPORT: ${{ runner.temp }}/maintenance-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selection-maintenance-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/maintenance-report.json
          if-no-files-found: error
